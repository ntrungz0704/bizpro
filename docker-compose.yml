services:
  postgres:
    image: postgres:16-alpine
    container_name: bizpro_postgres
    restart: always
    environment:
      POSTGRES_USER: bizpro_user
      POSTGRES_PASSWORD: bizpro_password
      POSTGRES_DB: bizpro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizpro_user -d bizpro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bizpro_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - optional

volumes:
  postgres_data:
    name: bizpro_postgres_data
  redis_data:
    name: bizpro_redis_data
