name: "BizPro+ CI (Continuous Integration)"

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: "Backend Quality, Tests & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bizpro_test_db
          POSTGRES_USER: bizpro_app
          POSTGRES_PASSWORD: test_secure_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Install backend dependencies"
        working-directory: ./backend
        run: npm ci

      - name: "Validate Prisma Schema"
        working-directory: ./backend
        run: npx prisma validate

      - name: "Generate Prisma Client"
        working-directory: ./backend
        run: npx prisma generate

      - name: "Apply Database Migrations"
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://bizpro_app:test_secure_password_12345@localhost:5432/bizpro_test_db?schema=public"
        run: npx prisma migrate deploy

      - name: "Run Backend Unit Tests"
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://bizpro_app:test_secure_password_12345@localhost:5432/bizpro_test_db?schema=public"
          JWT_ACCESS_SECRET: "ci_test_jwt_access_secret_32_characters_minimum"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_32_characters_minimum"
          AUTH_RESPONSE_ENVELOPE_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: npm test

      - name: "Build NestJS Application"
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: "Frontend Quality & Standalone Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Install frontend dependencies"
        working-directory: ./frontend
        run: npm ci

      - name: "Typecheck Frontend TypeScript"
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: "Build Next.js Standalone"
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "/api"
        run: npm run build
