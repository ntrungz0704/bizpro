name: "BizPro+ Docker Build, Scan & GHCR Publish"

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish Docker images to GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-and-publish:
    name: "Build, Security Scan & Publish Container Image"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: "backend"
            context: "./backend"
            dockerfile: "./backend/Dockerfile"
            image_name: "bizpro-backend"
          - service: "frontend"
            context: "./frontend"
            dockerfile: "./frontend/Dockerfile"
            image_name: "bizpro-frontend"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GitHub Container Registry (GHCR)"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract Docker metadata (Tags & Labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: "Build Local Docker Image for Security Verification"
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: "local-scan-${{ matrix.service }}:test"
          cache-from: type=gha

      - name: "Pre-Release Security Gate: Trivy Vulnerability Scan"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local-scan-${{ matrix.service }}:test"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: "High Severity Vulnerability Reporting"
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local-scan-${{ matrix.service }}:test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH"

      - name: "Generate SPDX SBOM Artifact"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local-scan-${{ matrix.service }}:test"
          format: "spdx-json"
          output: "sbom-bizpro-${{ matrix.service }}.spdx.json"

      - name: "Upload SBOM Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-${{ matrix.service }}"
          path: "sbom-bizpro-${{ matrix.service }}.spdx.json"
          retention-days: 30

      - name: "Inspect Image Artifact & Non-root Execution"
        run: |
          echo "Verifying runtime security boundaries..."
          docker run --rm "local-scan-${{ matrix.service }}:test" whoami
          docker run --rm "local-scan-${{ matrix.service }}:test" id

      - name: "Push Verified Release Image to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
