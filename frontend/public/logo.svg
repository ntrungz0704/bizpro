<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bp-bg-svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="45%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="bp-cyan-svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <filter id="bp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" floodColor="#2563EB" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- ICON EMBLEM: CAPITAL 'B' WITH '+' BADGE -->
  <g transform="translate(2, 2)" filter="url(#bp-shadow)">
    <!-- Outer Shield -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#bp-bg-svg)" />

    <!-- Capital 'B' Monogram -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 12 10 C 12 8.895 12.895 8 14 8 L 26 8 C 29.866 8 33 11.134 33 15 C 33 17.55 31.63 19.78 29.58 21 C 32.22 22.28 34 24.97 34 28 C 34 32.418 30.418 36 26 36 L 14 36 C 12.895 36 12 35.105 12 34 L 12 10 Z M 17 13 L 17 19 L 25 19 C 26.657 19 28 17.657 28 16 C 28 14.343 26.657 13 25 13 L 17 13 Z M 17 24 L 17 31 L 26 31 C 27.933 31 29.5 29.433 29.5 27.5 C 29.5 25.567 27.933 24 26 24 L 17 24 Z"
      fill="white"
    />

    <!-- Cyan Accent Core -->
    <circle cx="23.5" cy="27.5" r="2.2" fill="url(#bp-cyan-svg)" />

    <!-- Plus '+' Badge Top Right -->
    <g transform="translate(30, 0)">
      <circle cx="7" cy="7" r="6.5" fill="#0B132B" stroke="#38BDF8" stroke-width="1.8" />
      <path d="M7 4.2V9.8M4.2 7H9.8" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- WORDMARK: 'Biz' + 'Pro' + '+' Pill -->
  <g transform="translate(56, 12)">
    <text x="0" y="23" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.03em" fill="#0F172A">
      Biz
    </text>
    <text x="44" y="23" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.03em" fill="#2563EB">
      Pro
    </text>
    <rect x="92" y="6" width="18" height="20" rx="6" fill="#2563EB" />
    <text x="96" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="white">
      +
    </text>
  </g>
</svg>